<!DOCTYPE html>
<html>

<head>

  <meta name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">

    src="https://gc.kis.v2.scr.kaspersky-labs.com/FD126C42-EBFA-4E12-B309-BB3FDD723AC1/main.js?attr=_1UHwXzqexCLCKtRtgVhLzJTK9ElS-DOrqwXktfwWx8ny0z2VBQKzXHmYTnLzn6T_DjUbgnNLqycQxsBn8pOyA_lfEPWGsyUIZfhhIVwEsyGEXEhuq1Ckdes4DJCFnZZrR8Ph54orQWocTIOi7c8u-JHv_7QYaHW-S1MZvlYwlPbgutXwOracTEGC3-kWWtMF8htuvUHucHNYuhz3wnmzjxBs2ILLSPz5QS9mWaVXTx2slLCL8Q_9jGBacJ9ZLbxWn6McRZPeyIUqC05lCjtZDPhWA7rRarNvfNglfKXTy99-kxfsZBdFu6BESit0he55tgXad4E7bt-UMgojd1fpg"
    charset="UTF-8"></script>
  <style>
    :root {
      --bg: #ffffff;
      --app-bg: #f4f7f5;
      --card: #ffffff;
      --text: #1f2933;
      --muted: #6b7280;
      --primary: #1f8f4d;
      --primary-dark: #166c3a;
      --border: #e5e7eb;
      --danger: #b91c1c;
      --sticky: #eef8f1;
      --warning-bg: #fff7ed;
      --warning-text: #9a3412;
    }

    html {
      width: 100%;
      max-width: 100%;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      -webkit-text-size-adjust: 100%;
      touch-action: manipulation;
      background: var(--bg);
    }

    * {
      box-sizing: border-box;
    }

    body {
      width: 100%;
      max-width: 100%;
      min-height: 100vh;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      font-family: Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 16px;
      touch-action: manipulation;
    }

    .container {
      width: 100%;
      max-width: 430px;
      min-height: 100vh;
      margin: 0 auto;
      padding: 6px;
      background: var(--app-bg);
    }

    .header {
      text-align: center;
      margin-bottom: 8px;
    }

    .header h1 {
      margin: 0;
      font-size: 22px;
      color: var(--primary-dark);
    }

    .header p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .card {
      background: var(--card);
      border-radius: 12px;
      padding: 8px;
      margin-bottom: 10px;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.05);
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 4px;
      font-size: 13px;
    }

    input,
    textarea {
      width: 100%;
      max-width: 100%;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 16px;
      background: #fff;
    }

    textarea {
      min-height: 48px;
      resize: vertical;
    }

    .field {
      margin-bottom: 8px;
    }

    .produtos-card {
      padding: 0;
      overflow: visible;
    }

    .produto-header {
      position: sticky;
      top: 0;
      z-index: 20;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 64px 72px 36px;
      gap: 4px;
      background: var(--sticky);
      border-radius: 12px 12px 0 0;
      border-bottom: 1px solid var(--border);
      padding: 8px 6px;
      font-size: 13px;
      color: var(--primary-dark);
      font-weight: bold;
      align-items: center;
    }

    .produto-header div {
      text-align: center;
    }

    .ajuda {
      font-size: 12px;
      color: var(--muted);
      padding: 8px 6px;
      border-bottom: 1px solid var(--border);
      background: #fafafa;
      line-height: 1.35;
    }

    .produto-card {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 64px 72px 36px;
      gap: 4px;
      align-items: center;
      border-bottom: 1px solid var(--border);
      padding: 6px;
      background: #fff;
    }

    .produto-info {
      min-width: 0;
      padding-right: 2px;
    }

    .produto-nome {
      font-weight: bold;
      font-size: 18px;
      line-height: 1.15;
      color: #111827;
      word-break: break-word;
    }

    .produto-codigo {
      font-size: 11px;
      color: var(--muted);
      margin-top: 2px;
    }

    .produto-unidade {
      font-size: 11px;
      margin-top: 2px;
    }

    .unidade-legenda {
      color: var(--muted);
      font-weight: normal;
    }

    .unidade-valor {
      color: var(--primary-dark);
      font-weight: bold;
    }

    .produto-card input,
    .review-row input {
      padding: 8px 4px;
      font-size: 17px;
      border-radius: 8px;
      text-align: center;
      font-weight: bold;
    }

    .produto-card input[readonly],
    .review-row input[readonly] {
      background-color: #f3f4f6;
      color: #374151;
      cursor: default;
      border: 1px solid var(--border);
    }

    .dica-quantidade {
      display: none;
      margin: 6px;
      padding: 7px 9px;
      border-radius: 8px;
      background: #eef8f1;
      color: var(--primary-dark);
      font-size: 12px;
      font-weight: bold;
      text-align: center;
    }

    .dica-quantidade.visivel {
      display: block;
    }

    #dataConferencia {
      font-family: Arial, sans-serif;
      font-size: 17px;
      font-weight: bold;
      color: #374151;
    }

    .obs-compacta {
      grid-column: 1 / -1;
      display: none;
      margin-top: 4px;
    }

    .produto-card:focus-within .obs-compacta {
      display: block;
    }

    .btn {
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 15px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      background: var(--primary);
      color: white;
      margin-bottom: 8px;
    }

    .btn-secondary {
      background: #374151;
    }

    .btn:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    .status {
      text-align: center;
      font-weight: bold;
      margin-top: 10px;
      padding: 10px;
      border-radius: 10px;
      display: none;
    }

    .error {
      display: block;
      background: #fee2e2;
      color: var(--danger);
    }

    .loading {
      text-align: center;
      color: var(--muted);
      padding: 16px;
    }

    .review-box,
    .resumo-box {
      max-height: 55vh;
      overflow-y: auto;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #fff;
    }

    .review-header {
      position: sticky;
      top: 0;
      z-index: 10;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 80px 88px;
      gap: 4px;
      padding: 8px 6px;
      background: var(--sticky);
      border-bottom: 1px solid var(--border);
      font-size: 13px;
      font-weight: bold;
      color: var(--primary-dark);
      align-items: center;
    }

    .review-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 80px 88px;
      gap: 4px;
      align-items: center;
      border-bottom: 1px solid var(--border);
      padding: 8px 6px;
      background: #fff;
    }

    .review-produto {
      font-weight: bold;
      font-size: 16px;
      line-height: 1.15;
      word-break: break-word;
    }

    .review-unidade {
      font-size: 11px;
      color: var(--muted);
      margin-top: 2px;
    }

    .review-observacao {
      grid-column: 1 / -1;
      margin-top: 4px;
      padding: 7px 8px;
      border-radius: 8px;
      background: #f9fafb;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.35;
    }

    .review-alerta {
      background: var(--warning-bg);
      color: var(--warning-text);
      border-radius: 10px;
      padding: 10px;
      font-size: 16px;
      font-weight: bold;
      text-align: center;
      margin-bottom: 10px;
      line-height: 1.35;
    }

    .resumo-item {
      border-bottom: 1px solid var(--border);
      padding: 8px;
      font-size: 15px;
    }

    .resumo-produto {
      font-weight: bold;
    }

    .resumo-detalhes {
      color: var(--muted);
      margin-top: 3px;
      line-height: 1.4;
    }

    .success-title {
      color: #166534;
      margin: 0 0 6px 0;
      font-size: 24px;
      text-align: center;
    }

    .small-text {
      font-size: 13px;
      color: var(--muted);
      line-height: 1.35;
    }

    @media (max-width: 390px) {
      .container {
        max-width: 100%;
        padding: 4px;
      }

      .produto-header,
      .produto-card {
        grid-template-columns: minmax(0, 1fr) 58px 66px 34px;
        gap: 3px;
      }

      .review-header,
      .review-row {
        grid-template-columns: minmax(0, 1fr) 74px 80px;
        gap: 3px;
      }

      .produto-nome {
        font-size: 17px;
      }

      .produto-card input,
      .review-row input {
        font-size: 16px;
        padding: 8px 3px;
      }

      .review-produto {
        font-size: 15px;
      }
    }

    /* Estilos do Botão de Pesagem Fracionada */
    .btn-fracionar {
      width: 100%;
      min-width: 34px;
      height: 34px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #e8f5e9;
      color: var(--primary-dark);
      border: 1px solid #a5d6a7;
      border-radius: 8px;
      padding: 0;
      font-size: 22px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 0px;
      transition: all 0.2s ease;
      touch-action: manipulation;
    }

    .btn-fracionar:hover {
      background: #c8e6c9;
      border-color: var(--primary);
    }

    .fracionar-container {
      display: flex;
      padding-top: 0px;
      margin-top: 0px;
    }

    /* Modal Overlay */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(4px);
      z-index: 1000;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 16px;
      padding-top: calc(env(safe-area-inset-top) + 40px);
    }

    /* Modal Content */
    .modal-content {
      background: #ffffff;
      border-radius: 16px;
      width: 100%;
      max-width: 400px;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
      animation: modalSlideUp 0.25s ease-out;
    }

    @keyframes modalSlideUp {
      from {
        transform: translateY(15px);
        opacity: 0;
      }

      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    .modal-header {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .modal-header h3 {
      margin: 0;
      font-size: 16px;
      color: var(--primary-dark);
      word-break: break-word;
      padding-right: 8px;
    }

    .modal-product-subtitle {
      width: 100%;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
      font-size: 17px;
      line-height: 1.25;
      color: var(--text);
      font-weight: bold;
    }

    .modal-unitario-label {
      font-size: 15px;
      margin-bottom: 6px;
    }

    .modal-observacao-box {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
    }

    .modal-observacao-box label {
      font-size: 15px;
      margin-bottom: 6px;
    }

    .modal-observacao-ajuda {
      margin: 6px 0 0;
      font-size: 12px;
      color: var(--muted);
      line-height: 1.35;
    }

    .modal-observacao-erro {
      display: none;
      margin-top: 6px;
      padding: 8px;
      border-radius: 8px;
      background: #fee2e2;
      color: var(--danger);
      font-size: 13px;
      font-weight: bold;
    }

    .modal-observacao-erro.visivel {
      display: block;
    }

    .modal-close {
      background: none;
      border: none;
      font-size: 24px;
      cursor: pointer;
      color: var(--muted);
      padding: 4px;
      line-height: 1;
    }

    .modal-body {
      padding: 16px;
      overflow: hidden;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .modal-lista-scroll {
      flex: 1;
      overflow-y: auto;
      max-height: 38vh;
      padding-right: 2px;
    }

    .modal-add-fixo {
      flex-shrink: 0;
      padding-top: 8px;
      background: #ffffff;
    }

    #modalListaPesos {
      margin-bottom: 12px;
    }

    .peso-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
      animation: rowFadeIn 0.2s ease-out;
    }

    @keyframes rowFadeIn {
      from {
        opacity: 0;
        transform: translateX(-5px);
      }

      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    .peso-label {
      font-size: 12px;
      font-weight: bold;
      color: var(--muted);
      min-width: 60px;
    }

    .peso-input-wrapper {
      flex: 1;
      position: relative;
    }

    .peso-input-wrapper input {
      width: 100%;
      padding: 10px 45px 10px 10px;
      font-size: 16px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-weight: bold;
    }

    .peso-unit-badge {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 11px;
      color: var(--muted);
      pointer-events: none;
      font-weight: bold;
    }

    .btn-remover-peso {
      background: #fef2f2;
      color: var(--danger);
      border: 1px solid #fee2e2;
      border-radius: 8px;
      width: 38px;
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.2s;
    }

    .btn-remover-peso:hover {
      background: #fee2e2;
    }

    .btn-add-caixa {
      width: 100%;
      background: #f0fdf4;
      color: var(--primary);
      border: 1px dashed var(--primary);
      padding: 12px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-top: 0;
    }

    .btn-add-caixa:hover {
      background: #dcfce7;
    }

    .modal-footer {
      padding: 14px 16px;
      border-top: 1px solid var(--border);
      background: #fafafa;
      border-radius: 0 0 16px 16px;
    }

    .modal-resumo {
      text-align: center;
      font-weight: bold;
      font-size: 16px;
      color: var(--primary-dark);
      margin-bottom: 12px;
      background: #eef8f1;
      padding: 8px;
      border-radius: 8px;
      border: 1px solid #dcfce7;
    }

    .modal-botoes {
      display: flex;
      gap: 8px;
    }

    .modal-botoes button {
      flex: 1;
      padding: 12px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
      border: none;
    }

    .btn-cancelar {
      background: #e5e7eb;
      color: #374151;
    }

    .btn-cancelar:hover {
      background: #d1d5db;
    }

    .btn-salvar {
      background: var(--primary);
      color: #ffffff;
    }

    .btn-salvar:hover {
      background: var(--primary-dark);
    }
  </style>
</head>

<body>

  <div id="app" class="container">

    <div id="telaEdicao">
      <div class="header">
        <h1>Conferência Hortifruti</h1>
        <p>Informe caixas e quantidade/peso conferido.</p>
      </div>

      <div class="card">

        <div class="field">
          <label for="dataConferencia">Data</label>
          <input type="date" id="dataConferencia" required>
        </div>

        <div class="field">
          <label for="usuario">Conferente</label>
          <input type="text" id="usuario" placeholder="Nome">
        </div>

        <div class="field">
          <label for="observacaoGeral">Observação geral</label>
          <textarea id="observacaoGeral" placeholder="Opcional"></textarea>
        </div>

      </div>

      <div id="listaProdutos" class="card produtos-card">
        <div class="loading">
          Carregando produtos...
        </div>
      </div>

      <button class="btn" id="btnRevisar" onclick="revisarConferencia()">

        Revisar conferência

      </button>

      <div id="status" class="status"></div>
    </div>

    <div id="telaRevisao" style="display: none;"></div>
    <div id="telaSucesso" style="display: none;"></div>

  </div>

  <script>

    /*
      MOCK LOCAL
      Só funciona localmente.
      No Cloudflare Pages ignora automaticamente.
    */

    window.MOCK_PRODUTOS = [
      {
        codigo: '001',
        produto: 'Banana Prata',
        unidade: 'kg'
      },
      {
        codigo: '002',
        produto: 'Alface Crespa',
        unidade: 'maço'
      },
      {
        codigo: '003',
        produto: 'Morango',
        unidade: 'bandeja'
      },
      {
        codigo: '004',
        produto: 'Coco Verde',
        unidade: 'un'
      },
      {
        codigo: '005',
        produto: 'Uva preta sem caroço bdj 500g',
        unidade: 'bdj'
      }
    ];

    const IS_LOCAL =
      location.hostname === '127.0.0.1' ||
      location.hostname === 'localhost' ||
      location.protocol === 'file:';

    const APPS_SCRIPT_URL =
      'https://script.google.com/macros/s/AKfycbwIsPUHYB_aYnv3tgUNW-6HO82inU1vL0O67Rac6HsROippibvQb-zPEOlYvk5uNI0m/exec';

    let produtos = [];
    let ultimoPayload = null;
    let envioEmAndamento = false;
    let modalIndexAtual = null;

    function produtoEhOutro(produto) {
      const nome = String(produto && produto.produto ? produto.produto : '')
        .trim()
        .toUpperCase()
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '');

      return nome.startsWith('OUTRO');
    }

    function configurarCampoObservacaoModal(produto) {
      const campo = document.getElementById('modalObservacaoProduto');
      const label = document.getElementById('modalObservacaoLabel');
      const ajuda = document.getElementById('modalObservacaoAjuda');
      const erro = document.getElementById('modalObservacaoErro');

      if (!campo || !label || !ajuda || !erro) return;

      const isOutro = produtoEhOutro(produto);

      campo.value = produto.observacao || '';
      erro.classList.remove('visivel');
      erro.textContent = '';

      if (isOutro) {
        label.textContent = 'Descrição do produto *';
        campo.placeholder = 'Ex: jiló, abacaxi pequeno, couve-flor...';
        ajuda.textContent = 'Obrigatório para OUTRO/OUTROS. Informe qual produto foi conferido.';
      } else {
        label.textContent = 'Observação (opcional)';
        campo.placeholder = 'Ex: caixa avariada, produto maduro, peso estimado...';
        ajuda.textContent = 'Use apenas se houver alguma informação importante sobre este lançamento.';
      }
    }

    function validarObservacaoModal(produto) {
      const campo = document.getElementById('modalObservacaoProduto');
      const erro = document.getElementById('modalObservacaoErro');

      if (!campo) return true;

      const texto = campo.value.trim();
      const isOutro = produtoEhOutro(produto);

      if (isOutro && !texto) {
        if (erro) {
          erro.textContent = 'Informe a descrição do produto para OUTRO/OUTROS.';
          erro.classList.add('visivel');
        }
        campo.focus();
        return false;
      }

      produto.observacao = texto;

      if (erro) {
        erro.classList.remove('visivel');
        erro.textContent = '';
      }

      return true;
    }

    // Funções de Controle da Pesagem Fracionada / Cálculo por Unidade
    function abrirModalPesagem(index) {
      modalIndexAtual = index;
      const produto = produtos[index];
      const unidade = (produto.unidade || 'kg').trim().toLowerCase();
      const isKg = unidade === 'kg';

      const tituloTipo = document.getElementById('modalTituloTipo');
      const produtoSubtitulo = document.getElementById('modalProdutoSubtitulo');

      if (isKg) {
        tituloTipo.textContent = "Lançamento por Peso";
      } else {
        tituloTipo.textContent = "Lançamento de Itens Unitários";
      }

      produtoSubtitulo.innerHTML = `
        ${escapeHtml(produto.produto)}
        <span style="font-weight: normal; color: var(--muted); font-size: 12px; margin-left: 4px;">
          (Cód. ${escapeHtml(produto.codigo)})
        </span>
      `;

      const listaPesosContainer = document.getElementById('modalListaPesos');
      const btnAddCaixa = document.getElementById('btnAddCaixaModal');
      const camposUnitarioContainer = document.getElementById('modalCamposUnitario');

      configurarCampoObservacaoModal(produto);

      if (isKg) {
        listaPesosContainer.style.display = 'block';
        btnAddCaixa.style.display = 'flex';
        if (camposUnitarioContainer) camposUnitarioContainer.style.display = 'none';

        if (!produto.pesosCaixas) {
          produto.pesosCaixas = [];
        }

        const pesos = [...produto.pesosCaixas];
        if (pesos.length === 0) {
          pesos.push('');
        }

        document.getElementById('btnAddCaixaModal').onclick = () => {
          adicionarCaixaNoModal(produto.unidade || 'kg');
        };

        document.getElementById('btnSalvarModal').onclick = () => {
          confirmarPesagem();
        };

        renderizarLinhasModal(pesos, produto.unidade || 'kg');

        document.getElementById('modalPesagem').style.display = 'flex';

        const primeiroInput = document.querySelector('.peso-input');
        if (primeiroInput) {
          primeiroInput.focus();
          primeiroInput.select();
        }

        atualizarResumoModal(produto.unidade || 'kg');
      } else {
        // Produtos unitários
        listaPesosContainer.style.display = 'none';
        btnAddCaixa.style.display = 'none';
        if (camposUnitarioContainer) camposUnitarioContainer.style.display = 'block';

        const inputCaixasTotais = document.getElementById('modalInputCaixasTotais');
        const inputItensPorCaixa = document.getElementById('modalInputItensPorCaixa');

        // Sincronizar caso o usuário já tenha digitado na tela principal
        const mainCaixasVal = document.getElementById(`caixas_${index}`).value;
        const mainQtdPesoVal = document.getElementById(`qtdpeso_${index}`).value;
        const mainCaixas = mainCaixasVal ? parseInt(mainCaixasVal) : 0;
        const mainQtd = mainQtdPesoVal ? parseInt(mainQtdPesoVal) : 0;

        let caixasTotais = produto.caixasTotais;
        let itensPorCaixa = produto.itensPorCaixa;

        if (mainCaixas > 0 && mainQtd > 0) {
          if (mainCaixas !== produto.caixasTotais || mainQtd !== (produto.caixasTotais * produto.itensPorCaixa)) {
            caixasTotais = mainCaixas;
            itensPorCaixa = Math.round(mainQtd / mainCaixas);
          }
        } else if (mainCaixas > 0 && mainQtd === 0) {
          caixasTotais = mainCaixas;
          itensPorCaixa = '';
        } else if (mainCaixas === 0 && mainQtd > 0) {
          caixasTotais = '';
          itensPorCaixa = mainQtd;
        }

        inputCaixasTotais.value = caixasTotais !== undefined ? caixasTotais : '';
        inputItensPorCaixa.value = itensPorCaixa !== undefined ? itensPorCaixa : '';

        const atualizarResumoUnitario = () => {
          const cx = parseInt(inputCaixasTotais.value) || 0;
          const itens = parseInt(inputItensPorCaixa.value) || 0;
          const totalItens = cx * itens;

          const resumoDiv = document.getElementById('modalResumoTexto');
          resumoDiv.textContent = `Total: ${cx} caixa(s) | ${totalItens} ${produto.unidade || 'un'}`;
        };

        inputCaixasTotais.oninput = atualizarResumoUnitario;
        inputItensPorCaixa.oninput = atualizarResumoUnitario;

        inputCaixasTotais.onkeydown = (e) => {
          if (e.key === 'Enter') {
            e.preventDefault();
            inputItensPorCaixa.focus();
            inputItensPorCaixa.select();
          }
        };
        inputItensPorCaixa.onkeydown = (e) => {
          if (e.key === 'Enter') {
            e.preventDefault();
            confirmarPesagem();
          }
        };

        document.getElementById('btnSalvarModal').onclick = () => {
          confirmarPesagem();
        };

        document.getElementById('modalPesagem').style.display = 'flex';
        inputCaixasTotais.focus();
        inputCaixasTotais.select();

        atualizarResumoUnitario();
      }
    }

    function renderizarLinhasModal(pesos, unidade) {
      const container = document.getElementById('modalListaPesos');
      container.innerHTML = pesos.map((peso, index) => `
        <div class="peso-row" id="pesoRow_${index}">
          <div class="peso-label">Caixa ${index + 1}</div>
          <div class="peso-input-wrapper">
            <input 
              type="number" 
              class="peso-input" 
              step="0.001" 
              min="0" 
              placeholder="0.000" 
              value="${peso}" 
              oninput="atualizarResumoModal('${unidade}')"
              onkeydown="tratarTeclasModal(event, ${index}, '${unidade}')">
            <span class="peso-unit-badge">${escapeHtml(unidade)}</span>
          </div>
          <button type="button" class="btn-remover-peso" onclick="removerCaixaNoModal(${index}, '${unidade}')">
            ❌
          </button>
        </div>
      `).join('');
    }

    function tratarTeclasModal(event, index, unidade) {
      if (event.key === 'Enter') {
        event.preventDefault();
        const inputs = document.querySelectorAll('.peso-input');
        if (index === inputs.length - 1) {
          adicionarCaixaNoModal(unidade);
        } else {
          inputs[index + 1].focus();
          inputs[index + 1].select();
        }
      }
    }

    function adicionarCaixaNoModal(unidade) {
      const container = document.getElementById('modalListaPesos');
      const numCaixas = container.querySelectorAll('.peso-row').length;

      const newIndex = numCaixas;
      const html = `
        <div class="peso-row" id="pesoRow_${newIndex}">
          <div class="peso-label">Caixa ${newIndex + 1}</div>
          <div class="peso-input-wrapper">
            <input 
              type="number" 
              class="peso-input" 
              step="0.001" 
              min="0" 
              placeholder="0.000" 
              value="" 
              oninput="atualizarResumoModal('${unidade}')"
              onkeydown="tratarTeclasModal(event, ${newIndex}, '${unidade}')">
            <span class="peso-unit-badge">${escapeHtml(unidade)}</span>
          </div>
          <button type="button" class="btn-remover-peso" onclick="removerCaixaNoModal(${newIndex}, '${unidade}')">
            ❌
          </button>
        </div>
      `;

      const tempDiv = document.createElement('div');
      tempDiv.innerHTML = html;
      container.appendChild(tempDiv.firstElementChild);

      const inputs = container.querySelectorAll('.peso-input');
      const novoInput = inputs[inputs.length - 1];
      if (novoInput) {
        novoInput.focus();
      }

      atualizarResumoModal(unidade);
    }

    function removerCaixaNoModal(index, unidade) {
      const inputs = document.querySelectorAll('.peso-input');
      const pesos = [];
      inputs.forEach((input, i) => {
        if (i !== index) {
          pesos.push(input.value);
        }
      });

      if (pesos.length === 0) {
        pesos.push('');
      }

      renderizarLinhasModal(pesos, unidade);

      const novosInputs = document.querySelectorAll('.peso-input');
      if (novosInputs.length > 0) {
        novosInputs[novosInputs.length - 1].focus();
      }

      atualizarResumoModal(unidade);

    }

    function atualizarResumoModal(unidade) {
      const inputs = document.querySelectorAll('.peso-input');
      let totalCaixas = 0;
      let totalPeso = 0;

      inputs.forEach(input => {
        const val = Number(input.value.replace(',', '.')) || 0;
        if (val > 0) {
          totalCaixas++;
          totalPeso += val;
        }
      });

      const resumoDiv = document.getElementById('modalResumoTexto');
      resumoDiv.textContent = `Total: ${totalCaixas} caixa(s) | ${totalPeso.toFixed(3).replace(/\.?0+$/, '')} ${unidade}`;
    }

    function fecharModalPesagem() {
      document.getElementById('modalPesagem').style.display = 'none';
      modalIndexAtual = null;
    }

    function confirmarPesagem() {
      if (modalIndexAtual === null) return;

      const produto = produtos[modalIndexAtual];
      const unidade = (produto.unidade || 'kg').trim().toLowerCase();
      const isKg = unidade === 'kg';

      const inputCaixas = document.getElementById(`caixas_${modalIndexAtual}`);
      const inputQtdPeso = document.getElementById(`qtdpeso_${modalIndexAtual}`);

      if (!validarObservacaoModal(produto)) return;

      if (isKg) {
        const inputs = document.querySelectorAll('.peso-input');
        const pesos = [];
        let totalCaixas = 0;
        let totalPeso = 0;

        inputs.forEach(input => {
          const valStr = input.value.trim();
          if (valStr !== '') {
            const val = Number(valStr.replace(',', '.')) || 0;
            pesos.push(val);
            if (val > 0) {
              totalCaixas++;
              totalPeso += val;
            }
          }
        });

        produto.pesosCaixas = pesos;

        if (inputCaixas) {
          inputCaixas.value = totalCaixas > 0 ? totalCaixas : '';
        }
        if (inputQtdPeso) {
          inputQtdPeso.value = totalPeso > 0 ? Number(totalPeso.toFixed(3)) : '';
        }
      } else {
        const inputCaixasTotais = document.getElementById('modalInputCaixasTotais');
        const inputItensPorCaixa = document.getElementById('modalInputItensPorCaixa');

        const caixasTotais = parseInt(inputCaixasTotais.value) || 0;
        const itensPorCaixa = parseInt(inputItensPorCaixa.value) || 0;
        const totalItens = caixasTotais * itensPorCaixa;

        produto.caixasTotais = caixasTotais > 0 ? caixasTotais : '';
        produto.itensPorCaixa = itensPorCaixa > 0 ? itensPorCaixa : '';

        // Sincronizar array de pesos correspondente para manter retrocompatibilidade com relatórios
        if (caixasTotais > 0 && itensPorCaixa > 0) {
          produto.pesosCaixas = Array(caixasTotais).fill(itensPorCaixa);
        } else {
          produto.pesosCaixas = [];
        }

        if (inputCaixas) {
          inputCaixas.value = caixasTotais > 0 ? caixasTotais : '';
        }
        if (inputQtdPeso) {
          inputQtdPeso.value = totalItens > 0 ? totalItens : '';
        }
      }

      fecharModalPesagem();
    }

    document.addEventListener('DOMContentLoaded', () => {

      // Carregar data atual local no fuso horário do usuário
      const hoje = new Date();
      const ano = hoje.getFullYear();
      const mes = String(hoje.getMonth() + 1).padStart(2, '0');
      const dia = String(hoje.getDate()).padStart(2, '0');
      document.getElementById('dataConferencia').value = `${ano}-${mes}-${dia}`;

      prepararIframeEnvio();

      carregarProdutos();

    function validarConfiguracao() {

      if (IS_LOCAL) return true;

      if (
        !APPS_SCRIPT_URL ||
        APPS_SCRIPT_URL.includes('COLE_AQUI')
      ) {

        exibirErro(
          'Configure a URL do Apps Script.'
        );

        return false;
      }

      return true;
    }

    function carregarProdutos() {

      if (IS_LOCAL) {

        renderizarProdutos(MOCK_PRODUTOS);

        return;
      }

      if (!validarConfiguracao()) return;

      const callbackName =
        'receberProdutos_' + Date.now();

      window[callbackName] = function (lista) {

        try {

          renderizarProdutos(lista);

        } finally {

          delete window[callbackName];

          const script =
            document.getElementById(callbackName);

          if (script) script.remove();
        }
      };

      const script =
        document.createElement('script');

      script.id = callbackName;

      script.src =
        `${APPS_SCRIPT_URL}?action=produtos&callback=${callbackName}`;

      script.onerror = () => {

        delete window[callbackName];

        exibirErro(
          'Erro ao carregar produtos.'
        );
      };

      document.body.appendChild(script);
    }

    function formatarDataBR(dataISO) {
      if (!dataISO) return '-';

      const partes = dataISO.split('-');
      if (partes.length !== 3) return dataISO;

      return `${partes[2]}/${partes[1]}/${partes[0]}`;
    }

    function revisarConferencia() {

      limparStatus();

      const payload = montarPayload();

      if (!payload.dataConferencia) {

        exibirErro(
          'Informe a data da conferência.'
        );

        return;
      }

      const preenchidos =
        payload.itens.filter(item =>
          Number(item.caixas) > 0 ||
          Number(item.qtdPeso) > 0
        );

      if (preenchidos.length === 0) {

        exibirErro(
          'Preencha pelo menos um produto.'
        );

        return;
      }

      payload.itens = preenchidos;

      ultimoPayload = payload;

      mostrarTelaRevisao(payload);
    }

    function montarPayload() {

      const dataConferencia =
        document.getElementById('dataConferencia').value;

      const usuario =
        document.getElementById('usuario').value.trim();

      const observacaoGeral =
        document.getElementById('observacaoGeral').value.trim();

      const itens = produtos.map((produto, index) => ({

        codigo: produto.codigo,
        produto: produto.produto,

        unidade:
          produto.unidade || '',

        caixas:
          normalizarNumero(
            document.getElementById(`caixas_${index}`).value
          ),

        qtdPeso:
          normalizarNumero(
            document.getElementById(`qtdpeso_${index}`).value
          ),

        pesosCaixas:
          produto.pesosCaixas || [],

        observacao: produto.observacao || '',
        originalIndex: index

      }));

      return {
        dataConferencia,
        usuario,
        observacaoGeral,
        itens
      };
    }

    function confirmarEnviar() {

      if (IS_LOCAL) {

        mostrarPaginaSucesso(
          montarRespostaLocal(ultimoPayload)
        );

        return;
      }

      if (!validarConfiguracao()) return;

      if (
        !ultimoPayload ||
        !ultimoPayload.itens ||
        ultimoPayload.itens.length === 0
      ) {

        exibirErro('Não há dados.');

        return;
      }

      // Limpar status de erro de revisão se houver
      const statusRevisao = document.getElementById('statusRevisao');
      if (statusRevisao) {
        statusRevisao.className = 'status';
        statusRevisao.textContent = '';
        statusRevisao.style.display = 'none';
      }

      // A revisão é apenas conferência visual.
      // Para alterar caixas ou quantidade/peso, o usuário deve voltar e usar o botão + na tela principal.

      const btn =
        document.getElementById('btnConfirmar');

      btn.disabled = true;

      btn.textContent = 'Enviando...';

      enviarPorFormularioOculto(ultimoPayload);
    }

    function prepararIframeEnvio() {

      if (
        document.getElementById('iframeEnvio')
      ) return;

      const iframe =
        document.createElement('iframe');

      iframe.name = 'iframeEnvio';
      iframe.id = 'iframeEnvio';

      iframe.style.display = 'none';

      iframe.addEventListener('load', () => {

        if (!envioEmAndamento) return;

        envioEmAndamento = false;

        const respostaLocal =
          montarRespostaLocal(ultimoPayload);

        mostrarPaginaSucesso(respostaLocal);
      });

      document.body.appendChild(iframe);
    }

    function enviarPorFormularioOculto(payload) {

      prepararIframeEnvio();

      const formAntigo =
        document.getElementById('formEnvioOculto');

      if (formAntigo) formAntigo.remove();

      const form =
        document.createElement('form');

      form.id = 'formEnvioOculto';

      form.method = 'POST';

      form.action = APPS_SCRIPT_URL;

      form.target = 'iframeEnvio';

      form.style.display = 'none';

      const inputAction =
        document.createElement('input');

      inputAction.type = 'hidden';
      inputAction.name = 'action';
      inputAction.value = 'salvarConferencia';

      const inputPayload =
        document.createElement('input');

      inputPayload.type = 'hidden';
      inputPayload.name = 'payload';

      inputPayload.value =
        JSON.stringify(payload);

      form.appendChild(inputAction);

      form.appendChild(inputPayload);

      document.body.appendChild(form);

      envioEmAndamento = true;

      form.submit();
    }

    function montarRespostaLocal(payload) {

      return {

        sucesso: true,

        totalItens:
          payload.itens.length,

        dataConferencia:
          payload.dataConferencia,

        usuario:
          payload.usuario || '',

        itens:
          payload.itens.map(item => ({

            produto: item.produto,

            caixas:
              Number(item.caixas || 0),

            qtdPeso:
              Number(item.qtdPeso || 0),

            unidade:
              item.unidade || '',

            observacao:
              item.observacao || ''

          }))
      };
    }

      document.getElementById('telaEdicao').style.display = 'block';

                ` : ''}

      telaSucesso.innerHTML = `

        <div class="card">

          <h1 class="success-title">
            Enviado com sucesso!
          </h1>

          </p>

        <div class="card">

          <h2 style="font-size:18px; margin-top:0;">
            Resumo
          </h2>

          <p>
            <strong>Data:</strong>
            ${escapeHtml(formatarDataBR(resposta.dataConferencia))}
          </p>

          <p>
            <strong>Conferente:</strong>
            ${escapeHtml(resposta.usuario || '-')}
          </p>

          <p>
            <strong>Itens conferidos:</strong>
            ${resposta.totalItens}
          </p>

          <div class="resumo-box">
            ${resumoItens}
          </div>

        </div>

        <button
          class="btn"
          onclick="location.reload()">

          Nova conferência

        </button>

      `;

      telaRevisao.style.display = 'none';
      telaSucesso.style.display = 'block';

      window.scrollTo(0, 0);
    }

    function normalizarNumero(valor) {

      if (!valor) return 0;

      return Number(
        String(valor).replace(',', '.')
      ) || 0;
    }

    function exibirErro(erro) {

      const status =
        document.getElementById('status');

      if (!status) {

        alert(erro);

        return;
      }

      status.className = 'status error';

      status.textContent =
        erro && erro.message
          ? erro.message
          : erro;
    }

    function limparStatus() {

      const status =
        document.getElementById('status');

      if (!status) return;

      status.className = 'status';

      status.textContent = '';
    }

    function escapeHtml(valor) {

      return String(valor ?? '')

        .replace(/&/g, '&amp;')

        .replace(/</g, '&lt;')

        .replace(/>/g, '&gt;')

        .replace(/"/g, '&quot;')

        .replace(/'/g, '&#039;');
    }

  </script>

  <!-- Modal de Pesagem Fracionada / Lançamento Unitário -->
  <div id="modalPesagem" class="modal-overlay" style="display: none;">
    <div class="modal-content">
      <div class="modal-header"
        style="flex-direction: column; align-items: center; text-align: center; position: relative; width: 100%; border-bottom: 1px solid var(--border); padding: 14px 16px;">
        <button type="button" class="modal-close" onclick="fecharModalPesagem()"
          style="position: absolute; right: 16px; top: 12px;">&times;</button>
        <h3 id="modalTituloTipo" style="margin: 0; font-size: 16px; color: var(--primary-dark); font-weight: bold;">
          Lançamento de Itens Unitários</h3>
        <div id="modalProdutoSubtitulo" class="modal-product-subtitle">
          <!-- Nome e código do produto -->
        </div>
      </div>
      <div class="modal-body">
        <div class="modal-lista-scroll">
          <div id="modalListaPesos">
            <!-- Linhas de peso inseridas dinamicamente -->
          </div>
        </div>

        <div class="modal-add-fixo">
          <button type="button" class="btn-add-caixa" id="btnAddCaixaModal">
            ➕ Adicionar Caixa
          </button>
        </div>

        <div id="modalCamposUnitario" style="display: none;">
          <div class="field">
            <label for="modalInputCaixasTotais" class="modal-unitario-label">Total de caixas/sacos</label>
            <input type="number" id="modalInputCaixasTotais" min="0" step="1" placeholder="0">
          </div>
          <div class="field" style="margin-top: 12px;">
            <label for="modalInputItensPorCaixa" class="modal-unitario-label">Itens por caixa</label>
            <input type="number" id="modalInputItensPorCaixa" min="0" step="1" placeholder="0">
          </div>
        </div>

        <div class="modal-observacao-box">
          <label for="modalObservacaoProduto" id="modalObservacaoLabel">Observação (opcional)</label>
          <input type="text" id="modalObservacaoProduto" placeholder="Ex: caixa avariada, produto maduro...">
          <p class="modal-observacao-ajuda" id="modalObservacaoAjuda">
            Use apenas se houver alguma informação importante sobre este lançamento.
          </p>
          <div class="modal-observacao-erro" id="modalObservacaoErro"></div>
        </div>
      </div>
      <div class="modal-footer">
        <div class="modal-resumo" id="modalResumoTexto">
          Total: 0 caixas | 0 kg
        </div>
        <div class="modal-botoes">
          <button type="button" class="btn-cancelar" onclick="fecharModalPesagem()">Cancelar</button>
          <button type="button" class="btn-salvar" id="btnSalvarModal">Confirmar e Aplicar</button>
        </div>
      </div>
    </div>
  </div>

</body>

</html>
